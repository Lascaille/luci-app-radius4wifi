name: Build OpenWrt IPK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
     
      - name: Update Makefile Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            
            # Find and update Makefile wherever it lives in the repo
            MAKEFILE_PATH=$(find . -maxdepth 2 -name Makefile)
            if [ -n "$MAKEFILE_PATH" ]; then
              sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" "$MAKEFILE_PATH"
              echo "Updated $MAKEFILE_PATH PKG_VERSION to ${VERSION}"
            fi
          fi
      
      - name: Build Package
        run: |
          # Extract version from tag name (e.g., v1.0.5 -> 1.0.5) or default to 1.0.0
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          
          echo "Building package version: ${VERSION}"
          chmod +x make_ipk.sh
          PKG_VERSION="${VERSION}" ./make_ipk.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-radius4wifi-ipk
          path: /tmp/*.ipk

      - name: Attach IPK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
